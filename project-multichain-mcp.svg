<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 506 276" width="506" height="276">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2035"/><stop offset="1" stop-color="#0E1220"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1650"/><stop offset="1" stop-color="#07080F"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="0.5" stop-color="#7B2FF7"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E97"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="18%" r="70%"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.30"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .title { font: 700 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #F5F7FF; }
    .tag { font: 500 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #A9B1D6; }
    .chip { font: 700 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .line { font: 400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #C9D1F2; }
    .cta { font: 700 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #fff; text-anchor: middle; letter-spacing: 0.5px; }
    .float { animation: float 3.4s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <ellipse cx="253.0" cy="264" rx="201.6" ry="9" fill="#00E5FF" opacity="0.2" filter="url(#blur)"/>
  <rect x="18" y="18" width="480" height="236" rx="20" fill="url(#side)"/>
  <rect x="18" y="18" width="480" height="236" rx="20" fill="#00E5FF" opacity="0.10"/>
  <rect x="8" y="8" width="480" height="236" rx="20" fill="url(#face)"/>
  <rect x="8" y="8" width="480" height="236" rx="20" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="478.5" height="234.5" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M28 9.5 H468" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
  <g class="float">
    <ellipse cx="72" cy="106" rx="24" ry="4" fill="#000" opacity="0.4" filter="url(#blur)"/>
    <image href="data:image/png;base64," x="36" y="28" width="72" height="72"/>
  </g>
  <text x="128" y="52" class="title">Multichain MCP</text>
  <text x="128" y="74" class="tag">MCP server for AI agents</text>
  <rect x="128" y="82" width="34" height="22" rx="11" fill="#7B2FF7"/><text x="145.1" y="97" class="chip" fill="#ffffff">MCP</text><rect x="168.2" y="82" width="34" height="22" rx="11" fill="#CB3837"/><text x="185.3" y="97" class="chip" fill="#ffffff">npm</text><rect x="208.39999999999998" y="82" width="160" height="22" rx="11" fill="#00E5FF" fill-opacity="0.16" stroke="#00E5FF" stroke-opacity="0.7"/><text x="288.4" y="97" class="chip" fill="#00E5FF">Stacks · Celo · Base</text>
  <path d="M32 120 H464" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="32" y="144" class="line">Give any AI agent Stacks, Celo and Base</text><text x="32" y="166" class="line">in one package · listed on Glama · Pro &amp; Team plans</text>
  <g class="pulse"><circle cx="38" cy="218" r="4.5" fill="#FFC83D"/></g>
