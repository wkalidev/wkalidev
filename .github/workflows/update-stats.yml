name: Update GitHub Stats SVGs

on:
  schedule:
    # Runs once a day at 03:17 UTC (off-peak, avoids everyone hitting the API at 00:00)
    - cron: '17 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub stats card
        run: |
          curl -sS "https://github-readme-stats.vercel.app/api?username=wkalidev&show_icons=true&theme=radical&hide_border=true&count_private=true" \
            -o github-stats.svg

      - name: Fetch Top Languages card
        run: |
          curl -sS "https://github-readme-stats.vercel.app/api/top-langs/?username=wkalidev&layout=compact&theme=radical&hide_border=true" \
            -o top-langs.svg

      - name: Verify the SVGs actually rendered (not an error page)
        run: |
          for f in github-stats.svg top-langs.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "::error::$f does not look like a valid SVG — the API may be down. Keeping the last known good version."
              git checkout -- "$f" 2>/dev/null || true
            fi
          done

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh GitHub stats SVGs"
          git push
